name: biblia_app
description: "Bíblia & Hinário - leitura da Bíblia, hinário, músicas e boletim da igreja."
publish_to: 'none'

version: 5.4.0+32

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  shared_preferences_platform_interface: ^2.4.1
  file_selector: ^1.1.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Nenhum asset de conteúdo está incluído para evitar violação de direitos autorais.
    # Conteúdo deve ser adicionado apenas com licença comprovada (ver docs/COMPLIANCE_2026-10-14.md).
