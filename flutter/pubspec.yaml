name: biblia_app
description: "Bíblia & Hinário - leitura da Bíblia, hinário, músicas e boletim da igreja."
publish_to: 'none'

version: 5.2.2+27

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/biblia.json
    - assets/biblia_ara.json
    - assets/biblia_nvi.json
    - assets/biblia_ntlh.json
    - assets/biblia_bkj.json
    - assets/redletter.json
    - assets/hinos.json
    - assets/musicas.json
    - assets/boletim.json
    - assets/biblioteca.json
    - assets/logo_ipm.png
